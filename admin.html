<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Live Help Submissions Admin | Creative Owners Club</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap wide">
    <header class="brand">
      <h1>Creative Owners Club</h1>
      <p>Live Help Submissions Admin</p>
    </header>

    <section id="loginView" class="card login" hidden>
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div id="loginError" class="error" role="alert" hidden></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="primary" id="loginBtn">Sign In</button>
      </form>
    </section>

    <section id="appView" hidden>
      <div id="listError" class="error" role="alert" hidden></div>
      <div class="toolbar">
        <div class="filters" id="tabs"></div>
        <div><span class="sub" id="who"></span> <button id="signOut">Sign out</button></div>
      </div>
      <div id="noAccess" class="card" hidden>This account doesn't have admin access.</div>
      <div class="table-wrap" id="tableWrap" hidden>
        <table>
          <thead><tr id="headRow"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <div class="head"><h3>Submission</h3><button id="closeDetail" aria-label="Close">✕</button></div>
    <div id="detailError" class="error" role="alert" hidden></div>
    <div class="actions" id="detailActions"></div>
    <dl id="detailList"></dl>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="fields.js"></script>
  <script>
    const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    const FIELDS = window.FIELDS.filter(f => f.key);
    const $ = id => document.getElementById(id);
    let all = [];
    let tab = null;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const date = d => d ? new Date(d).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    const phone = s => { const d = String(s ?? '').replace(/\D/g, ''); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (s ?? ''); };
    const d = r => r.data || {};
    const ymd = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    // 'YYYY-MM-DD' -> 'Tue, Oct 27' (read as a local date, not UTC)
    const callDay = s => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
      return m ? new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : (s || '');
    };

    function format(f, v) {
      if (v == null || v === '') return '';
      if (f.type === 'money') return '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (f.type === 'percent') return Number(v) + '%';
      if (f.type === 'phone') return phone(v);
      if (f.type === 'date') return callDay(v);
      if (f.type === 'checkbox') return v === true || v === 'true' ? 'Yes' : 'No';
      return v;
    }

    // ---- Tabs: one per call date (upcoming first, then past newest first), then No date and Removed ----
    const tabOf = r => r.removed_at != null ? 'removed' : (d(r).call_date || 'none');

    function tabList() {
      const today = ymd(new Date());
      const dates = [...new Set(all.map(tabOf))].filter(t => t !== 'removed' && t !== 'none');
      const upcoming = dates.filter(t => t >= today).sort();
      const past = dates.filter(t => t < today).sort().reverse();
      const tabs = [...upcoming, ...past].map(t => [t, callDay(t)]);
      if (all.some(r => tabOf(r) === 'none')) tabs.push(['none', 'No date']);
      tabs.push(['removed', 'Removed']);
      return tabs;
    }

    function renderTabs() {
      const tabs = tabList();
      if (!tabs.some(([t]) => t === tab)) tab = tabs[0][0];
      $('tabs').innerHTML = tabs.map(([t, label]) => {
        const n = all.filter(r => tabOf(r) === t).length;
        return `<button data-tab="${esc(t)}"${t === tab ? ' class="active"' : ''}>${esc(label)} <span class="count">(${n})</span></button>`;
      }).join('');
    }

    // ---- Table columns: [heading, row => html] ----
    const DEAL_CLASS = { 'Mortgage takeover': 'takeover', 'Seller financing': 'financing', 'Cash': 'cash' };
    const dealBadge = r => d(r).deal_path ? `<span class="badge ${DEAL_CLASS[d(r).deal_path] || ''}">${esc(d(r).deal_path)}</span>` : '';

    const COLUMNS = [
      ['Submitted', r => esc(date(r.created_at))],
      ['Member', r => esc(d(r).member_name)],
      ['Address', r => esc([d(r).street_address, d(r).city, d(r).state, d(r).postal_code].filter(Boolean).join(', '))],
      ['Calling', r => `${esc(d(r).contact_type)}: ${esc(d(r).contact_name)}<br><span class="sub">${esc(phone(d(r).contact_phone))}</span>`],
      ['Deal', dealBadge],
      ['Plan', r => esc(d(r).plan)],
      ['Called', r => `<label class="check inline"><input type="checkbox" data-called ${r.called ? 'checked' : ''}> Called</label>
        <span class="sub called-at">${r.called ? esc(date(r.called_at)) : ''}</span>`],
    ];

    function render() {
      renderTabs();
      $('headRow').innerHTML = COLUMNS.map(([h]) => `<th>${esc(h)}</th>`).join('');
      const rows = all.filter(r => tabOf(r) === tab).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      $('rows').innerHTML = rows.map(r => `
        <tr data-id="${esc(r.id)}">${COLUMNS.map(([, cell]) => `<td>${cell(r)}</td>`).join('')}</tr>`).join('')
        || `<tr><td colspan="${COLUMNS.length}" class="sub">No leads here.</td></tr>`;
    }

    $('tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-tab]');
      if (!b) return;
      tab = b.dataset.tab;
      render();
    });

    // ---- Saving ----
    function showErr(msg) {
      $('listError').textContent = msg;
      $('listError').hidden = !msg;
      if (msg) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Updates one lead and returns the saved row, or null after showing the error.
    async function save(id, changes, errTarget = 'listError') {
      $('listError').hidden = true;
      $('detailError').hidden = true;
      const { data, error } = await sb.from('live_help_submissions').update(changes).eq('id', id).select();
      const msg = error ? error.message : !data || !data.length ? "Couldn't save: this account can't update leads." : '';
      if (msg) {
        if (errTarget === 'detailError') { $('detailError').textContent = msg; $('detailError').hidden = false; }
        else showErr(msg);
        return null;
      }
      const row = data[0];
      all = all.map(r => r.id === row.id ? row : r);
      return row;
    }

    const rowOf = el => all.find(x => String(x.id) === el.closest('tr[data-id]').dataset.id);

    // The Called checkbox saves immediately.
    $('rows').addEventListener('change', async e => {
      if (!e.target.matches('[data-called]')) return;
      const box = e.target;
      box.disabled = true;
      const row = await save(rowOf(box).id, { called: box.checked });
      box.disabled = false;
      if (!row) { box.checked = !box.checked; return; }
      render();
    });

    // ---- Detail view ----
    let detailRow = null;

    function openDetail(r) {
      detailRow = r;
      $('detailError').hidden = true;
      $('detailActions').innerHTML = r.removed_at != null
        ? '<button data-act="restore">Restore</button>'
        : '<button data-act="remove" class="danger">Remove</button>';

      const get = k => d(r)[k];
      const items = [['Submitted', date(r.created_at)],
        ...FIELDS.filter(f => !f.showIf || f.showIf(get)).map(f => [f.short || f.label, format(f, get(f.key))]),
        ['Deal path', get('deal_path')],
        ['Called', r.called ? `Yes, ${date(r.called_at)}` : 'No'],
        ['Last updated', r.updated_at ? `${date(r.updated_at)}${r.updated_by ? ' by ' + r.updated_by : ''}` : '']];
      $('detailList').innerHTML = items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v) || '<span class="sub">—</span>'}</dd>`).join('');
      $('detail').showModal();
    }

    $('detailActions').addEventListener('click', async e => {
      const b = e.target.closest('button[data-act]');
      if (!b || !detailRow) return;
      const remove = b.dataset.act === 'remove';
      if (remove && !confirm('Remove this lead?')) return;
      b.disabled = true;
      const row = await save(detailRow.id, { removed_at: remove ? new Date().toISOString() : null }, 'detailError');
      b.disabled = false;
      if (!row) return;
      $('detail').close();
      render();
    });

    $('rows').addEventListener('click', e => {
      if (e.target.closest('input, label')) return;
      const tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      const r = rowOf(tr);
      if (r) openDetail(r);
    });
    $('closeDetail').addEventListener('click', () => $('detail').close());
    $('detail').addEventListener('click', e => { if (e.target === $('detail')) $('detail').close(); });

    // ---- Auth ----
    function showLogin() { $('loginView').hidden = false; $('appView').hidden = true; }

    async function showApp(session) {
      $('loginView').hidden = true;
      $('appView').hidden = false;
      $('who').textContent = session.user.email;
      showErr('');
      const { data, error } = await sb.from('live_help_submissions').select('*').order('created_at', { ascending: false });
      if (error) { showErr(error.message); return; }
      all = data || [];
      $('noAccess').hidden = all.length > 0;
      $('tableWrap').hidden = all.length === 0;
      $('tabs').hidden = all.length === 0;
      render();
    }

    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      $('loginError').hidden = true;
      $('loginBtn').disabled = true;
      const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
      $('loginBtn').disabled = false;
      if (error) { $('loginError').textContent = error.message; $('loginError').hidden = false; return; }
      $('password').value = '';
      showApp(data.session);
    });

    $('signOut').addEventListener('click', async () => {
      await sb.auth.signOut();
      all = [];
      $('rows').innerHTML = '';
      showLogin();
    });

    sb.auth.getSession().then(({ data }) => data.session ? showApp(data.session) : showLogin());
  </script>
</body>
</html>
