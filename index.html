<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Help Submission | Creative Owners Club</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1>Creative Owners Club</h1>
      <p>Live Help Submission</p>
    </header>

    <section id="resultBox" class="card result approved" hidden></section>

    <form id="helpForm" novalidate>
      <div id="sections"></div>
      <div id="formError" class="error" role="alert" hidden></div>
      <button type="submit" class="primary" id="submitBtn">Submit Lead</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@googlemaps/js-api-loader@1.16.8/dist/index.min.js"></script>
  <script src="config.js"></script>
  <script src="fields.js"></script>
  <script>
    const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    const FIELDS = window.FIELDS.filter(f => f.key);
    const form = document.getElementById('helpForm');
    const errBox = document.getElementById('formError');
    const resultBox = document.getElementById('resultBox');
    const btn = document.getElementById('submitBtn');

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    // ---- Build the form from FIELDS ----
    const INPUT_TYPES = { text: 'text', email: 'email', phone: 'tel', money: 'text', percent: 'text', number: 'text', date: 'date' };
    const AUTOCOMPLETE = { email: 'email', phone: 'tel' };
    const NUMERIC = ['money', 'percent', 'number'];
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    function labelText({ text, link }) {
      if (!link) return [text];
      const [before, after] = text.split(link.text);
      const a = el('a', null, link.text);
      a.href = link.href;
      a.target = '_blank';
      a.rel = 'noopener';
      return [before, a, after];
    }

    function buildField(f) {
      const box = el('div', f.full || f.type === 'textarea' || f.type === 'checkbox' ? 'full' : '');
      box.dataset.key = f.key;
      const label = el('label');
      label.htmlFor = f.key;

      if (f.type === 'checkbox') {
        const input = el('input');
        input.type = 'checkbox';
        input.id = input.name = f.key;
        input.required = !!f.required;
        label.className = f.list ? 'check big' : 'check';
        const text = el('span');
        text.append(...labelText({ text: f.label, link: f.link }));
        if (f.required) text.append(' ', el('span', 'req', '*'));
        if (f.list) {
          const ol = el('ol');
          for (const item of f.list) {
            const li = el('li');
            li.append(...labelText(item));
            ol.append(li);
          }
          text.append(ol);
        }
        label.append(input, text);
        box.append(label);
        return box;
      }

      label.append(...labelText({ text: f.label, link: f.link }));
      if (f.required) label.append(' ', el('span', 'req', '*'));
      if (f.help) label.append(el('span', 'note', f.help));

      let input;
      if (f.type === 'buttons') {
        // A hidden input holds the value so the rest of the form treats it like any other field.
        input = el('input');
        input.type = 'hidden';
        input.id = input.name = f.key;
        const group = el('div', 'choice');
        group.setAttribute('role', 'group');
        for (const o of f.options) {
          const b = el('button', null, o);
          b.type = 'button';
          b.dataset.value = o;
          b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', () => {
            input.value = o;
            input.dispatchEvent(new Event('change'));
          });
          group.append(b);
        }
        box.append(label, input, group);
        return box;
      } else if (f.type === 'textarea') {
        input = el('textarea');
      } else if (f.type === 'select') {
        input = el('select');
        input.append(new Option('Select…', ''));
        for (const o of f.options || []) input.append(new Option(o, o));
      } else {
        input = el('input');
        input.type = INPUT_TYPES[f.type] || 'text';
        if (AUTOCOMPLETE[f.type]) input.autocomplete = AUTOCOMPLETE[f.type];
        if (NUMERIC.includes(f.type)) input.inputMode = 'decimal';
        if (f.type === 'date') input.min = ymd(new Date());
      }
      input.id = input.name = f.key;
      input.required = !!f.required;

      box.append(label);
      if (f.type === 'money' || f.type === 'percent') {
        const wrap = el('div', f.type === 'money' ? 'money' : 'money suffix');
        wrap.append(el('span', null, f.type === 'money' ? '$' : '%'), input);
        box.append(wrap);
      } else {
        box.append(input);
      }
      return box;
    }

    function buildSections() {
      const root = document.getElementById('sections');
      let grid = null;
      for (const item of window.FIELDS) {
        if (item.section) {
          const card = el('section', 'card');
          card.append(el('h2', null, item.section));
          if (item.intro) card.append(el('p', 'intro', item.intro));
          grid = el('div', 'grid');
          if (item.addressPicker) {
            const search = el('div', 'full');
            search.id = 'addressSearch';
            search.hidden = true;
            const lab = el('label', null, 'Search address');
            lab.id = 'addressSearchLabel';
            const slot = el('div');
            slot.id = 'addressSearchSlot';
            search.append(lab, slot, el('div', 'hint', 'Pick an address to fill in the fields below. You can still edit them.'));
            grid.append(search);
          }
          card.append(grid);
          root.append(card);
        } else {
          grid.append(buildField(item));
        }
      }
    }
    buildSections();

    // ---- Conditional fields ----
    const isShown = f => !f.showIf || f.showIf(key => form.elements[key].value);

    // Show the pressed button in each Yes/No style group.
    function syncChoices() {
      form.querySelectorAll('.choice').forEach(group => {
        const v = group.closest('[data-key]').querySelector('input').value;
        group.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === v)));
      });
    }

    // Fields are in order, so clearing an earlier hidden field also hides the branches that depend on it.
    function applyVisibility() {
      for (const f of FIELDS) {
        if (!f.showIf) continue;
        const shown = isShown(f);
        form.querySelector(`[data-key="${f.key}"]`).hidden = !shown;
        if (!shown) {
          const input = form.elements[f.key];
          if (input.type === 'checkbox') input.checked = false; else input.value = '';
          delete input.dataset.touched;
          setFieldError(f.key, '');
        }
      }
      syncChoices();
    }

    // ---- Field validation (mirrors the rules enforced in submit_live_help) ----
    const val = key => {
      const input = form.elements[key];
      return input.type === 'checkbox' ? input.checked : input.value.trim();
    };
    const emailOk = s => /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(s);
    const phoneOk = s => {
      let d = s.replace(/\D/g, '');
      if (d.length === 11 && d[0] === '1') d = d.slice(1);
      return /^[2-9]\d{9}$/.test(d);
    };
    const numText = s => s.replace(/[$,%\s]/g, '');
    const numOk = s => /^\d+(\.\d+)?$/.test(numText(s));

    function fieldMessage(f) {
      if (!isShown(f)) return '';
      const v = val(f.key);
      if (f.type === 'checkbox') return f.required && !v ? 'Please check this box.' : '';
      if (!v) return f.required ? 'This field is required.' : '';
      if (f.type === 'email' && !emailOk(v)) return 'Enter a valid email address.';
      if (f.type === 'phone' && !phoneOk(v)) return 'Enter a valid 10-digit US phone number.';
      if (f.type === 'money' && !numOk(v)) return 'Enter a dollar amount.';
      if (f.type === 'percent' && !numOk(v)) return 'Enter a percentage, e.g. 3.5';
      if (f.type === 'number' && !numOk(v)) return 'Enter a number.';
      const r = f.check ? f.check(v) : true;
      return r === true ? '' : r;
    }

    function setFieldError(key, msg) {
      const input = form.elements[key];
      const box = input.closest('.grid > div');
      let err = box.querySelector('.field-error');
      if (!err) {
        err = el('div', 'field-error');
        err.id = key + '_error';
        box.append(err);
      }
      err.textContent = msg;
      err.hidden = !msg;
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');
      if (msg) input.setAttribute('aria-describedby', err.id); else input.removeAttribute('aria-describedby');
    }

    const validateField = f => {
      const msg = fieldMessage(f);
      setFieldError(f.key, msg);
      return !msg;
    };

    // Check a field when the user leaves it; clear its error as soon as it's fixed.
    for (const f of FIELDS) {
      const input = form.elements[f.key];
      input.addEventListener('blur', () => {
        if (!val(f.key) && input.dataset.touched !== '1') return;
        input.dataset.touched = '1';
        validateField(f);
      });
      input.addEventListener('change', () => {
        input.dataset.touched = '1';
        validateField(f);
        applyVisibility();
      });
      input.addEventListener('input', () => { if (input.getAttribute('aria-invalid') === 'true') validateField(f); });
    }
    applyVisibility();

    // ---- Google Place Autocomplete (Places API New) ----
    let PlaceAutocompleteElement = null;

    function fillAddress(place) {
      const comps = place.addressComponents || [];
      const get = (type, short) => {
        const c = comps.find(c => c.types.includes(type));
        return c ? (short ? c.shortText : c.longText) : '';
      };
      const street = [get('street_number'), get('route', true)].filter(Boolean).join(' ');
      const city = get('locality') || get('sublocality_level_1') || get('postal_town') || get('neighborhood');
      const state = get('administrative_area_level_1', true);
      const zip = get('postal_code');

      form.elements.street_address.value = street;
      form.elements.city.value = city;
      form.elements.state.value = [...form.elements.state.options].some(o => o.value === state) ? state : '';
      form.elements.postal_code.value = zip;
      for (const f of FIELDS.filter(f => ['street_address', 'city', 'state', 'postal_code'].includes(f.key))) {
        form.elements[f.key].dataset.touched = '1';
        validateField(f);
      }
    }

    function mountAutocomplete() {
      if (!PlaceAutocompleteElement) return;
      const pac = new PlaceAutocompleteElement({ includedRegionCodes: ['us'] });
      pac.setAttribute('aria-labelledby', 'addressSearchLabel');
      pac.setAttribute('placeholder', 'Start typing the property address');
      const onPlace = async place => {
        try {
          await place.fetchFields({ fields: ['addressComponents'] });
          fillAddress(place);
        } catch (err) {
          console.error('Place details failed', err);
        }
      };
      // Current event name, plus the older one for API versions that still use it.
      pac.addEventListener('gmp-select', e => e.placePrediction && onPlace(e.placePrediction.toPlace()));
      pac.addEventListener('gmp-placeselect', e => e.place && onPlace(e.place));
      document.getElementById('addressSearchSlot').replaceChildren(pac);
    }

    (async () => {
      try {
        const loader = new google.maps.plugins.loader.Loader({ apiKey: window.GOOGLE_MAPS_KEY, version: 'weekly' });
        ({ PlaceAutocompleteElement } = await loader.importLibrary('places'));
        mountAutocomplete();
        document.getElementById('addressSearch').hidden = false;
      } catch (err) {
        // The form still works without the picker; addresses can be typed in.
        console.error('Address search unavailable', err);
      }
    })();

    // ---- Submit ----
    function showError(msg) {
      errBox.textContent = msg;
      errBox.hidden = false;
      errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function resetForm() {
      form.reset();
      form.querySelectorAll('input[type="hidden"]').forEach(i => { i.value = ''; });
      form.querySelectorAll('.field-error').forEach(e => { e.textContent = ''; e.hidden = true; });
      form.querySelectorAll('[aria-invalid]').forEach(i => i.setAttribute('aria-invalid', 'false'));
      form.querySelectorAll('[data-touched]').forEach(i => delete i.dataset.touched);
      applyVisibility();
      mountAutocomplete();
      errBox.hidden = true;
      resultBox.hidden = true;
      form.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showThanks(name) {
      const box = el('div');
      box.append(el('p', 'lead', `Thanks ${name}! Your lead has been submitted for the next live call.`));
      const again = el('button', 'primary', 'Submit another');
      again.type = 'button';
      again.addEventListener('click', resetForm);
      box.append(again);
      resultBox.replaceChildren(box);
      resultBox.hidden = false;
      form.hidden = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.hidden = true;

      const invalid = FIELDS.filter(f => !validateField(f));
      if (invalid.length) {
        let first = form.elements[invalid[0].key];
        if (first.type === 'hidden') first = first.closest('[data-key]').querySelector('button');
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        first.focus({ preventScroll: true });
        return;
      }

      const p = {};
      for (const f of FIELDS) {
        if (!isShown(f)) continue;
        const v = val(f.key);
        if (f.type === 'checkbox') p[f.key] = v;
        else if (NUMERIC.includes(f.type)) p[f.key] = v === '' ? null : Number(numText(v));
        else p[f.key] = v === '' ? null : v;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        const { data, error } = await sb.rpc('submit_live_help', { p });
        if (error) throw error;
        const r = Array.isArray(data) ? data[0] : data;
        if (!r || r.result !== 'received') throw new Error('Unexpected response from server.');
        showThanks(p.member_name);
      } catch (err) {
        showError(err.message || String(err));
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Lead';
      }
    });
  </script>
</body>
</html>
